<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lootify - Real-Time Quick-Commerce FMCG Price Comparison</title>

<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #111118;
    --bg3: #16161f;
    --glass: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.08);
    --accent: #7c3aed;
    --accent2: #06b6d4;
    --accent3: #f59e0b;
    --text: #f1f5f9;
    --text2: #94a3b8;
    --text3: #64748b;
    --green: #10b981;
    --red: #ef4444;
    --card-r: 16px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* BG gradient */
  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,58,237,0.15) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -200px; right: -200px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(6,182,212,0.1) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--glass-border);
    padding: 12px 20px;
    display: flex; align-items: center; gap: 12px;
    flex-wrap: wrap;
  }
  .logo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.5rem; font-weight: 700;
    background: linear-gradient(135deg, #7c3aed, #06b6d4);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    flex-shrink: 0;
  }
  .logo span { font-size: 0.65rem; color: var(--text3); display: block; -webkit-text-fill-color: var(--text3); margin-top: -4px; }

  /* SEARCH */
  .search-wrap { flex: 1; min-width: 200px; position: relative; }
  #searchInput {
    width: 100%;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 10px 40px 10px 16px;
    color: var(--text);
    font-size: 0.9rem;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  #searchInput:focus { border-color: var(--accent); }
  #searchInput::placeholder { color: var(--text3); }
  .search-icon {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    color: var(--text3); pointer-events: none; font-size: 1rem;
  }

  /* CONTROLS */
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, .btn {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    padding: 8px 12px;
    cursor: pointer;
    outline: none;
    transition: all 0.2s;
  }
  select:hover, .btn:hover { border-color: var(--accent); background: rgba(124,58,237,0.1); }
  .btn-currency {
    background: rgba(245,158,11,0.15);
    border-color: rgba(245,158,11,0.3);
    color: var(--accent3);
    font-weight: 600;
  }
  .btn-currency:hover { background: rgba(245,158,11,0.25); }

  /* CATEGORY PILLS */
  .cat-bar {
    padding: 12px 20px;
    display: flex; gap: 8px; overflow-x: auto;
    scrollbar-width: none; position: relative; z-index: 1;
  }
  .cat-bar::-webkit-scrollbar { display: none; }
  .cat-pill {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.78rem; font-weight: 500;
    cursor: pointer; white-space: nowrap;
    transition: all 0.2s; color: var(--text2);
    flex-shrink: 0;
  }
  .cat-pill:hover { border-color: var(--accent); color: var(--text); }
  .cat-pill.active {
    background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(6,182,212,0.2));
    border-color: var(--accent);
    color: var(--text);
  }

  /* STATS BAR */
  .stats-bar {
    padding: 8px 20px;
    font-size: 0.75rem; color: var(--text3);
    display: flex; align-items: center; gap: 16px;
    border-bottom: 1px solid var(--glass-border);
    position: relative; z-index: 1;
  }
  .stats-bar span { color: var(--accent2); font-weight: 600; }

  /* MAIN GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    padding: 20px;
    position: relative; z-index: 1;
  }

  /* PRODUCT CARD */
  .card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--card-r);
    overflow: hidden;
    transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), border-color 0.2s;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(124,58,237,0.4);
    box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(124,58,237,0.2);
  }
  .card-header {
    padding: 16px 16px 12px;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .card-emoji {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, rgba(124,58,237,0.2), rgba(6,182,212,0.15));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; flex-shrink: 0;
  }
  .card-info { flex: 1; min-width: 0; }
  .card-brand {
    font-size: 0.7rem; color: var(--accent2);
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 2px;
  }
  .card-name {
    font-size: 0.9rem; font-weight: 600; color: var(--text);
    line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-type { font-size: 0.73rem; color: var(--text3); margin-top: 2px; }
  .badge {
    font-size: 0.65rem; font-weight: 700;
    padding: 3px 8px; border-radius: 20px;
    white-space: nowrap; flex-shrink: 0;
  }
  .badge-deal { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
  .badge-hot  { background: rgba(239,68,68,0.15);  color: var(--red);   border: 1px solid rgba(239,68,68,0.3); }
  .badge-new  { background: rgba(124,58,237,0.15); color: #a78bfa;      border: 1px solid rgba(124,58,237,0.3); }

  /* PRICE ROWS */
  .prices {
    padding: 0 16px 12px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .price-row {
    display: flex; align-items: center;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 8px;
    padding: 7px 10px;
    gap: 8px;
    transition: background 0.15s;
  }
  .price-row:hover { background: rgba(255,255,255,0.05); }
  .price-row.best { border-color: rgba(16,185,129,0.25); background: rgba(16,185,129,0.05); }
  .platform-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .platform-name { font-size: 0.75rem; color: var(--text2); flex: 1; }
  .price-val {
    font-size: 0.85rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .price-val.best-price { color: var(--green); }
  .price-val.higher { color: var(--text3); }
  .discount-tag {
    font-size: 0.65rem; color: var(--green);
    background: rgba(16,185,129,0.1);
    padding: 2px 5px; border-radius: 4px; font-weight: 600;
  }
  .delivery-time {
    font-size: 0.65rem; color: var(--text3);
  }

  /* CARD FOOTER */
  .card-footer {
    padding: 10px 16px 14px;
    display: flex; gap: 8px;
  }
  .btn-shop {
    flex: 1; padding: 8px;
    background: linear-gradient(135deg, rgba(124,58,237,0.2), rgba(6,182,212,0.15));
    border: 1px solid rgba(124,58,237,0.3);
    border-radius: 8px;
    color: var(--text); font-size: 0.75rem; font-weight: 600;
    cursor: pointer; text-decoration: none; display: block;
    text-align: center; transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }
  .btn-shop:hover {
    background: linear-gradient(135deg, rgba(124,58,237,0.4), rgba(6,182,212,0.3));
    border-color: var(--accent); transform: scale(1.02);

  /* SECTION HEADER */
  .section-header {
    padding: 16px 20px 4px;
    font-size: 0.7rem; color: var(--text3);
    text-transform: uppercase; letter-spacing: 0.1em;
    font-weight: 600; position: relative; z-index: 1;
    display: flex; align-items: center; gap: 10px;
  }
  .section-header::after {
    content: ''; flex: 1; height: 1px;
    background: var(--glass-border);
  }

  /* EMPTY STATE */
  #emptyState {
    display: none; text-align: center;
    padding: 80px 20px;
    position: relative; z-index: 1;
  }
  #emptyState .empty-icon { font-size: 3rem; margin-bottom: 12px; }
  #emptyState h3 { font-size: 1.1rem; color: var(--text2); margin-bottom: 6px; }
  #emptyState p { font-size: 0.85rem; color: var(--text3); }

  /* LOADER */
  .loader {
    display: flex; align-items: center; justify-content: center;
    padding: 40px; color: var(--text3); font-size: 0.85rem;
    position: relative; z-index: 1;
  }
  .spinner {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--glass-border);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
    margin-right: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Platform colors */
  .dot-blinkit  { background: #f6c90e; }
  .dot-zepto    { background: #8b5cf6; }
  .dot-instamart{ background: #f97316; }
  .dot-bigbasket{ background: #e11d48; }
  .dot-flipkart { background: #2563eb; }
  .dot-dmart    { background: #16a34a; }
  .dot-amazon   { background: #ea580c; }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
    .card-emoji { width: 38px; height: 38px; font-size: 1.2rem; }
    .card-name { font-size: 0.8rem; }
  }
</style>
</head>

// ═══════════════════════════════════════════════
//  PRICE GENERATION
// ═══════════════════════════════════════════════
function genPrices(product) {
  const base = product.basePrice;
  const platforms = [...PLATFORMS].sort(() => Math.random() - 0.5).slice(0, 4 + Math.floor(Math.random() * 3));
  return platforms.map((p, i) => {
    const variation = base * (0.85 + Math.random() * 0.35);
    const price = Math.round(variation / 5) * 5 || base;
    return { platform: p, price };
  }).sort((a, b) => a.price - b.price);
}

// Seed-based deterministic prices
function seededRand(seed) {
  let x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}

function getDeterministicPrices(product) {
  const base = product.basePrice;
  const seed = product.id.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  const count = 3 + Math.floor(seededRand(seed) * 3); // 3-5 platforms
  const chosen = [];
  const shuffled = [...PLATFORMS].sort((a, b) => seededRand(seed + a.id.length) - seededRand(seed + b.id.length));
  for (let i = 0; i < count && i < shuffled.length; i++) {
    const pSeed = seed + i * 100;
    const variation = 0.85 + seededRand(pSeed) * 0.35;
    const price = Math.max(1, Math.round(base * variation));
    chosen.push({ platform: shuffled[i], price });
  }
  return chosen.sort((a, b) => a.price - b.price);
}

// ═══════════════════════════════════════════════
//  RENDER ENGINE
// ═══════════════════════════════════════════════
function fmt(price) {
  if (currency === 'INR') {
    if (price >= 1000) return '₹' + (price / 1000).toFixed(1) + 'k';
    return '₹' + price;
  } else {
    const usd = price / INR_USD;
    return '$' + usd.toFixed(2);
  }
}

function buildCard(product) {
  const prices = getDeterministicPrices(product);
  const best = prices[0];
  const worst = prices[prices.length - 1];
  const savings = worst.price - best.price;
  const savingsPct = Math.round((savings / worst.price) * 100);

  const badgeHTML = product.badge ? `
    <span class="badge badge-${product.badge}">
      ${product.badge === 'deal' ? '🔥 DEAL' : product.badge === 'hot' ? '🌶 HOT' : '✨ NEW'}
    </span>` : '';

  const priceRows = prices.slice(0, 4).map((p, i) => `
    <div class="price-row ${i === 0 ? 'best' : ''}">
      <span class="platform-dot ${p.platform.dot}"></span>
      <span class="platform-name">${p.platform.name}</span>
      <span class="delivery-time">${p.platform.time}</span>
      ${i === 0 && savingsPct > 5 ? `<span class="discount-tag">-${savingsPct}%</span>` : ''}
      <span class="price-val ${i === 0 ? 'best-price' : 'higher'}">${fmt(p.price)}</span>
    </div>`).join('');

  const shopLink = `${best.platform.base}/search?q=${encodeURIComponent(product.name)}`;

  return `
    <div class="card" data-id="${product.id}">
      <div class="card-header">
        <div class="card-emoji">${product.emoji}</div>
        <div class="card-info">
          <div class="card-brand">${product.brand}</div>
          <div class="card-name">${product.name}</div>
          <div class="card-type">${product.type}</div>
        </div>
        ${badgeHTML}
      </div>
      <div class="prices">${priceRows}</div>
      <div class="card-footer">
        <a href="${shopLink}" target="_blank" class="btn-shop">Best: ${fmt(best.price)} on ${best.platform.name} →</a>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════
//  FILTER & RENDER
// ═══════════════════════════════════════════════
function getFiltered() {
  const catFilter = CATS.find(c => c.id === currentCat)?.filter || (() => true);
  let results = CATALOG.filter(p => {
    if (!catFilter(p)) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      return p.name.toLowerCase().includes(q) ||
             p.brand.toLowerCase().includes(q) ||
             p.type.toLowerCase().includes(q) ||
             p.tags.some(t => t.includes(q));
    }
    return true;
  });

  // Sort
  if (sortMode === 'price-asc') results.sort((a, b) => a.basePrice - b.basePrice);
  else if (sortMode === 'price-desc') results.sort((a, b) => b.basePrice - a.basePrice);
  else if (sortMode === 'discount') results.sort((a, b) => (b.badge === 'deal' ? 1 : 0) - (a.badge === 'deal' ? 1 : 0));

  return results;
}

let allFiltered = [];

function renderProducts() {
  allFiltered = getFiltered();
  visibleCount = 0;
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '';
  document.getElementById('emptyState').style.display = allFiltered.length === 0 ? 'block' : 'none';
  document.getElementById('resultCount').textContent = allFiltered.length;
  loadMore();
}

function loadMore() {
  const grid = document.getElementById('productGrid');
  const chunk = allFiltered.slice(visibleCount, visibleCount + PAGE_SIZE);
  chunk.forEach(p => {
    grid.insertAdjacentHTML('beforeend', buildCard(p));
  });
  visibleCount += chunk.length;
  document.getElementById('loader').style.display = visibleCount < allFiltered.length ? 'flex' : 'none';
}

// ═══════════════════════════════════════════════
//  INFINITE SCROLL
// ═══════════════════════════════════════════════
const loaderEl = document.getElementById('loader');
const observer = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting && visibleCount < allFiltered.length) {
    loadMore();
  }
}, { rootMargin: '200px' });
observer.observe(loaderEl);

// ═══════════════════════════════════════════════
//  INIT CATEGORY PILLS
// ═══════════════════════════════════════════════
function initCats() {
  const bar = document.getElementById('catBar');
  CATS.forEach(c => {
    const pill = document.createElement('button');
    pill.className = 'cat-pill' + (c.id === 'all' ? ' active' : '');
    pill.textContent = c.label;
    pill.addEventListener('click', () => {
      document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      currentCat = c.id;
      renderProducts();
    });
    bar.appendChild(pill);
  });
}
